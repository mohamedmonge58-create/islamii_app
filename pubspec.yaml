name: islamii_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  audioplayers: ^6.0.0
  flutter_svg: ^2.0.10
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Gemini_Generated_Image_6leylh6leylh6ley.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
     - assets/images/
     - assets/files/surah/
     - assets/files/hadith/

  fonts:
    - family: Janna
      fonts:
        - asset: assets/fonts/Janna_LT.ttf
          weight: 700
