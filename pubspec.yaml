name: islamii_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  intl: ^0.19.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  audioplayers: ^6.0.0
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  flutter_svg: ^2.0.10
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.2
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_qiblah: ^3.1.0
  scrollable_positioned_list: ^0.3.8
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Gemini_Generated_Image_3hqbix3hqbix3hqb.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
flutter:
  uses-material-design: true

  assets:
     - assets/images/
     - assets/files/surah/
     - assets/files/hadith/
     - assets/audio/a4ab138564ce.mp3

  fonts:
    - family: Janna
      fonts:
        - asset: assets/fonts/Janna_LT.ttf
          weight: 700
    - family: alfont
      fonts:
        - asset: assets/fonts/alfont_com_ArbFONTS-116-arabtype.ttf
          weight: 700
